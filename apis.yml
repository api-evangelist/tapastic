name: Tapastic
description: >-
  Tapastic is the former brand of Tapas, a digital storytelling platform (Tapas
  Entertainment, a Kakao company) that hosts webcomics and web novels across
  romance, fantasy, action, drama, and other genres. Readers access serialized
  episodes through a free-with-premium model using an in-app "Ink" currency, and
  creators publish original and user-generated stories via the creators.tapas.io
  publishing portal. The original tapastic.com domain has been retired and now
  rebrands to tapas.io. As of this enrichment pass the platform exposes only a
  consumer web/mobile application and a content-creator publishing surface; it
  publishes no public developer API, OpenAPI specification, SDK, developer
  portal, or documented webhook/event surface. This profile was surfaced as a
  500 Global portfolio company and remains a lead in the API Evangelist network
  with no API artifacts to enrich.
